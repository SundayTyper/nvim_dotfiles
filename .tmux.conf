unbind C-b
set -g prefix M-a
bind-key M-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB"
set -g extended-keys always
set -g extended-keys-format csi-u

set -g mouse on
set -g focus-events on
set -g history-limit 100000
set -g escape-time 10
set -g display-time 3000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g status-keys vi
set -g automatic-rename off
set -g allow-rename off

# Pane navigation: Alt + h/j/k/l
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Window navigation: Alt + Shift + h/l
bind-key -n M-H previous-window
bind-key -n M-L next-window

# Prefix actions
unbind -T prefix Space
bind-key -T prefix Space split-window -v -c "#{pane_current_path}"
# Shift+Space only works if the terminal forwards it as a distinct key.
bind-key -T prefix S-Space command-prompt -p "New window name" "new-window -c '#{pane_current_path}' -n '%%'"
bind-key -T prefix N command-prompt -p "New window name" "new-window -c '#{pane_current_path}' -n '%%'"
bind-key -T prefix r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
bind-key -T prefix w kill-pane
bind-key -T prefix W confirm-before -p "Kill window #W? (y/n)" kill-window
bind-key -T prefix q kill-session
bind-key -T prefix R command-prompt -I "#{window_name}" -p "Rename window" "rename-window '%%'"

# Pane styling
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-format " #[fg=#6b7280]#{pane_index} #[fg=#9ca3af]#{pane_current_command} #[default]"
set -g pane-border-style "fg=#253045"
set -g pane-active-border-style "fg=#7dd3fc"

# Status line styling
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify centre
set -g status-left-length 30
set -g status-right-length 90
set -g status-style "bg=#0f172a,fg=#cbd5e1"
set -g message-style "bg=#38bdf8,fg=#0f172a"
set -g message-command-style "bg=#f59e0b,fg=#111827"

set -g status-left "#[bg=#38bdf8,fg=#0f172a,bold] #S #[bg=#0f172a,fg=#38bdf8]|#[default]"
set -g status-right "#[fg=#94a3b8]#{?client_prefix,[prefix],} #[fg=#fbbf24]%a %d %b #[fg=#38bdf8]%H:%M #[fg=#94a3b8]#H"

setw -g window-status-separator ""
setw -g window-status-format " #[fg=#94a3b8]#I #[fg=#cbd5e1]#W "
setw -g window-status-current-format " #[bg=#1d4ed8,fg=#eff6ff,bold]#I #[bg=#1e293b,fg=#e2e8f0,bold]#W "
setw -g window-status-current-style "bg=#0f172a,fg=#e2e8f0"
setw -g window-status-style "bg=#0f172a,fg=#94a3b8"
setw -g window-status-activity-style "bg=#0f172a,fg=#f59e0b,bold"
setw -g window-status-bell-style "bg=#ef4444,fg=#f8fafc,bold"

# Plugins managed by TPM, if installed.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

if-shell "test -d ~/.tmux/plugins/tpm" "run-shell ~/.tmux/plugins/tpm/tpm"
